name: CI

on:
  pull_request:
  push:
    branches: [mobi]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint-and-types:
    name: Python lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --locked --all-packages --extra web --extra zaber
      - name: Ruff check
        run: uv run --locked ruff check
      - name: Type check (basedpyright)
        run: uv run --locked basedpyright

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --locked --all-packages --extra web --extra zaber
      - name: Run unit tests
        run: uv run --locked pytest -m "not hardware and not slow" -q

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm -r test
      - name: Type check, format, and lint
        run: pnpm -r run check
