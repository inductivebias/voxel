name: OME-Zarr integration

on:
  pull_request:
    paths:
      - 'omezarr/**'
      - 'src/vxl/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ome-zarr.yml'
  push:
    branches: [mobi]

permissions:
  contents: read

jobs:
  writer-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Writer, metadata, deskew and simulated camera integration
        run: uv run --locked pytest omezarr/tests tests/slow/test_camera_lifecycle.py -k 'not s3' -m 'not hardware' -q
      - name: S3 quantization provenance (direct and staged)
        env:
          VOXEL_REQUIRE_MINIO: '1'
        run: |
          docker info
          docker pull ghcr.io/coollabsio/minio@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
          uv run --locked pytest omezarr/tests/test_s3.py::test_s3_auto_sqrt_provenance -q -rs
